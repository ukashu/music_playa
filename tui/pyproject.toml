[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music-playa-tui"
version = "0.1.0"
description = "Textual interface for music_playa"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "textual",
    "python-dotenv",
]

[project.scripts]
music-playa-tui = "music_playa_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_playa_tui = ["*.tcss"]
