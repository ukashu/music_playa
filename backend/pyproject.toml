[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music_playa_core"
version = "0.1.0"
description = "Core library for the music_playa player"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "python-mpv",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
