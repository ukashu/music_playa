[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music_playa_core"
version = "0.1.0"
description = "Core library for the music_playa player"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "python-mpv",
    "numpy",
    "mutagen",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mutmut"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["music_playa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
# One failing test is enough to kill a mutant.
pytest_add_cli_args = ["-x"]
